<div class="chat-container card">
    <div class="chat-header card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">💬 Xat en Directe</h5>
        <span class="badge bg-primary rounded-pill" id="message-count">0</span>
    </div>
    <div class="chat-messages card-body" id="chat-messages">
        <p class="text-muted text-center">Carregant missatges...</p>
    </div>
    <div class="chat-footer card-footer">
        {% if user.is_authenticated and event.status == 'live' %}
        <form id="chat-form" class="d-flex">
            {% csrf_token %}
            <div class="flex-grow-1 me-2">
                {{ chat_form.message }}
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-paper-plane"></i> Enviar
            </button>
        </form>
        <div id="chat-errors" class="text-danger mt-2"></div>
        {% elif not user.is_authenticated %}
        <p class="text-center text-muted">Inicia sessió per participar</p>
        {% else %}
        <p class="text-center text-muted">El xat només està disponible durant l'esdeveniment</p>
        {% endif %}
    </div>
</div>

<script>
    const eventId = {{ event.id }};
</script>
